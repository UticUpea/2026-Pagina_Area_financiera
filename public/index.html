<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  
  <!-- ✅ CSP corregida para PDF + iframes + workers -->
  <meta http-equiv="Content-Security-Policy" 
        content="default-src 'self'; 
                 script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.facebook.com https://connect.facebook.net https://cdn.jsdelivr.net; 
                 style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; 
                 font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; 
                 img-src 'self' data: https: blob:; 
                 frame-src 'self' https://www.google.com https://maps.google.com https://maps.googleapis.com https://www.facebook.com https://facebook.com https://m.facebook.com https://connect.facebook.net https://www.youtube.com https://youtube.com https://youtu.be https://www.youtube-nocookie.com https://player.vimeo.com https://vimeo.com https://archivosminio.upea.bo blob:; 
                 child-src 'self' blob:; 
                 object-src 'self' https://archivosminio.upea.bo blob:; 
                 worker-src 'self' blob:; 
                 connect-src 'self' https://apiadministrador.upea.bo https://archivosminio.upea.bo https://www.google.com https://maps.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com ws://localhost:* ws://127.0.0.1:* ws://*:* wss://*:*; 
                 base-uri 'self'; 
                 form-action 'self';">

  <link rel="icon" href="<%= BASE_URL %>./upea.png" id="ico">

  <!-- Preconexión a fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,100;9..40,200;9..40,400&family=Dancing+Script:wght@400;500;600&family=Krub:wght@400;700&family=Staatliches&display=swap" rel="stylesheet">
  
  <title id="title-page">UPEA</title>

  <!-- Estilos -->
  <link rel="preload" href="<%= BASE_URL %>./assets/css/normalize.css" as="style">
  <link rel="stylesheet" href="<%= BASE_URL %>./assets/css/normalize.css">
  <link rel="preload" href="<%= BASE_URL %>./assets/css/style.css" as="style">
  <link rel="stylesheet" href="<%= BASE_URL %>./assets/css/vendor.css">
  <link rel="stylesheet" href="<%= BASE_URL %>./assets/css/style.css">
  <link rel="stylesheet" href="<%= BASE_URL %>./assets/css/responsive.css">
  
  <!-- ✅ Font Awesome 6 (solo una vez, con all.min.css) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <noscript>
    <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
  </noscript>

  <!-- Preloader -->
  <div class="preloader" id="preloader">
    <div class="preloader-inner">
      <div class="spinner">
        <div class="dot1"></div>
        <div class="dot2"></div>
      </div>
    </div>
  </div>
  
  <!-- App Vue -->
  <div id="app"></div>
  
  <!-- Facebook root -->
  <div id="fb-root"></div>

  <!-- Scripts externos -->
  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
  
  <!-- Scripts locales -->
  <script src="<%= BASE_URL %>./assets/js/vendor.js"></script>
  <script src="<%= BASE_URL %>./assets/js/counter.js"></script>
  <script src="<%= BASE_URL %>./assets/js/main.js"></script>
</body>
</html>
